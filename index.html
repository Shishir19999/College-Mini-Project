<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Online FoodShop - Home</title>
</head>
<body>
  
  <div class="">
    <div class="row">
      <div class="col-md-2">
        <div id="leftSide">
          <div id="logo">
              <h1>
                  <a href="index.html"><br>
                      <img src="logo.png" alt="logo">
                  </a>
              </h1>
          </div>    
          <div class="list-sidebar">
            <ul class="list-name">
              <li><a href="index.html" class="active" aria-current="page">HOME</a> </li><hr>
              <li><a href="order.html">TAKE ORDERS</a> </li><hr>
              <li><a href="contact.html">CONTACT </a> </li><hr>
              <li><a href="aboutus.html">ABOUT US</a> </li><hr>
            </ul>
          </div>
        
        </div>
      </div>


      <div class="col-md-10">
        <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="3000">
              <img src="keychain.jpg" class="d-flex align-items-center justify-content-center w-100" alt="...">
            </div>
            <div class="carousel-item" data-bs-interval="3000">
              <img src="burger.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item" data-bs-interval="3000">
              <img src="assorted product.jpg" class="d-block w-100" alt="...">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
